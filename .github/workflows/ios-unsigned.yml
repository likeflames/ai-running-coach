name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 机器池只能用 macos-26（Xcode 26.6 / iPhoneOS 26.5 SDK）。踩过的坑：
    #
    # - macos-14：只有 Xcode 15.4 / iOS SDK 17.5，RN 0.88 直接编不过。
    # - macos-15：预装 Xcode 26.0~26.3，但 ReactNativeDependencies 里的 Swift 包
    #   要求 swift-tools 6.2；就算切到 26.3，expo-modules-jsi 也会在
    #   JavaScriptObject.swift 报 `sending 'slot' risks causing data races`
    #   （降到 Swift 5 语言模式会引出 `'$' is not a valid digit` 等一串新错误）。
    #   只有 Xcode 26.6 的编译器能干净编过。
    # - macos-26：容量紧，常见「排队 15~20 分钟后判定拿不到机器」，
    #   看到这种失败直接重跑即可，不是代码问题。
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK"
          swift --version
          node --version
          MAJOR=${SDK%%.*}
          if [ "$MAJOR" -lt 18 ]; then
            echo "::error::iOS SDK $SDK 过低（需要 18+），机器池不对"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build (code signing disabled)
        run: |
          set -euo pipefail
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['workspace']['schemes'][0])")
          echo "workspace: $WORKSPACE"
          echo "scheme:    $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          cd ios
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app bundle: $APP"
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ai-running-coach-unsigned.ipa Payload
          ls -lh ai-running-coach-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ai-running-coach-unsigned-ipa
          path: ios/ai-running-coach-unsigned.ipa
          retention-days: 30
