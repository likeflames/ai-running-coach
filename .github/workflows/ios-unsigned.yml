name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 机器池选择说明（踩过的坑）：
    # - macos-14 只有 Xcode 15.4 / iOS SDK 17.5，RN 0.88 + Expo 58 需要 Xcode 16+，编译必失败；
    # - macos-15 的池子长期排队，实测 30 分钟拿不到机器；
    # - macos-26 是 arm64 池，容量紧但能拿到，Xcode 26 完整支持。
    # 因此固定 macos-26；拿不到机器时用 workflow_dispatch 重试即可。
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK"
          node --version
          # RN 0.88 / Expo 58 需要 Xcode 16 及以上；SDK 版本过低直接失败，避免出现一堆看不懂的编译错误
          MAJOR=${SDK%%.*}
          if [ "$MAJOR" -lt 18 ]; then
            echo "::error::iOS SDK $SDK 过低（需要 18+）。当前机器池不对，请换 runs-on。"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build (code signing disabled)
        run: |
          set -euo pipefail
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['workspace']['schemes'][0])")
          echo "workspace: $WORKSPACE"
          echo "scheme:    $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          cd ios
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app bundle: $APP"
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ai-running-coach-unsigned.ipa Payload
          ls -lh ai-running-coach-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ai-running-coach-unsigned-ipa
          path: ios/ai-running-coach-unsigned.ipa
          retention-days: 30
