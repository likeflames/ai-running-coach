name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 机器池选择（踩过的坑，别随便改）：
    #
    # - macos-15 是标准池，基本 1 分钟内就能拿到机器。它同时预装了 Xcode 16.x 和
    #   Xcode 26.x，但默认指向 Xcode_16.4（Swift 6.1）。而 RN 0.88 自带的
    #   ReactNativeDependencies 里的 Swift 包要求 swift-tools 6.2，
    #   所以「直接 build」会报 `package 'apple' is using Swift tools version 6.2.0
    #   but the installed version is 6.1.0`。下面显式切到 Xcode 26 即可。
    # - macos-26 池子自带 Xcode 26，但容量极紧：经常排队 20 分钟后直接判定
    #   「job was not acquired by Runner of type hosted」，白等一场。
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          # 要 Xcode 26（Swift 6.2），但不要最新的 26.3：它对 Swift 6 数据竞争的检查
          # 更严，expo-modules-jsi 会报 `sending 'slot' risks causing data races` 直接编译失败。
          # 26.0 / 26.1 都能过，按顺序取第一个存在的。
          APP=""
          for v in 26.0 26.0.1 26.1 26.1.1 26.2 26.2.0; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then APP="/Applications/Xcode_${v}.app"; break; fi
          done
          if [ -z "$APP" ]; then
            APP=$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -V | head -1 || true)
          fi
          if [ -z "$APP" ]; then
            echo "::error::这台机器上没有 Xcode 26，换机器池"
            ls -1 /Applications | grep -i xcode || true
            exit 1
          fi
          echo "使用 $APP"
          sudo xcode-select -s "$APP"
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK"
          MAJOR=${SDK%%.*}
          if [ "$MAJOR" -lt 18 ]; then
            echo "::error::iOS SDK $SDK 过低（需要 18+），Xcode 没切成功"
            exit 1
          fi
          swift --version
          node --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Relax Swift 6 concurrency in expo-modules-jsi
        run: |
          set -euo pipefail
          # expo-modules-jsi 的 Package.swift 声明 swiftLanguageModes: [.v6]，
          # 在 Xcode 26 的 Swift 6.2 下，JavaScriptObject.swift 里那句
          # `nonisolated(unsafe) let slot` 会被判定成 "sending 'slot' risks causing data races"，
          # 直接编译失败（库本身的写法问题，不是我们的代码）。
          # 降到 Swift 5 语言模式后，这条诊断只是警告，产物不受影响。
          F=node_modules/expo-modules-jsi/apple/Package.swift
          grep -n "swiftLanguageModes" "$F"
          sed -i '' 's/swiftLanguageModes: \[\.v6\]/swiftLanguageModes: [.v5]/' "$F"
          grep -n "swiftLanguageModes" "$F"
          ! grep -q "swiftLanguageModes: \[.v6\]" "$F"

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build (code signing disabled)
        run: |
          set -euo pipefail
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['workspace']['schemes'][0])")
          echo "workspace: $WORKSPACE"
          echo "scheme:    $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_VERSION=5.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          cd ios
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app bundle: $APP"
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ai-running-coach-unsigned.ipa Payload
          ls -lh ai-running-coach-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ai-running-coach-unsigned-ipa
          path: ios/ai-running-coach-unsigned.ipa
          retention-days: 30
